name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：v3 的默认 packages 里带了一个早已从 SDK 仓库移除的 "tools"，
      # 用默认值会在 "Set up Android SDK" 就报 Failed to find package 'tools'。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库里没有 keystore.properties 时 release 会 initWith debug，
      # 而 CI 容器里没有 ~/.android/debug.keystore，会报
      # "Keystore file '.../debug.keystore' not found for signing config 'release'"。
      # ci/debug.keystore 是固定生成的公开 debug key（storepass/keypass 都是 android），
      # 每次构建签名一致，装新包可以直接覆盖旧的。
      - name: Prepare debug keystore
        run: |
          echo "ANDROID_USER_HOME=$GITHUB_WORKSPACE/.ci-android" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ci-android" "$HOME/.android"
          cp ci/debug.keystore "$GITHUB_WORKSPACE/.ci-android/debug.keystore"
          cp ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Build release APK
        run: |
          # 仓库里的 gradlew 没有可执行位（作者在 Windows 上提交的），先补上
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudmusictool-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
